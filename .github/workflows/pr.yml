name: pr

on:
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'docs/**'
      - '*.md'

jobs:
  scala-2_13:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: set up sbt
        uses: sbt/setup-sbt@v1

      - name: Launch elastic docker
        uses: ./.github/actions/launch-elasticsearch

      - name: run tests
        timeout-minutes: 30
        run: sbt "++2.13.18; test"

  scala-3:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: set up sbt
        uses: sbt/setup-sbt@v1

      - name: Launch elastic docker
        uses: ./.github/actions/launch-elasticsearch

      - name: run tests
        run: sbt "++3.3.8; elastic4s-scala3/test"
